  <rect x="378" y="350" width="200" height="180" rx="16" fill="#1E293B" stroke="#818CF8" stroke-width="1.5"/>
  <rect x="378" y="350" width="200" height="6" rx="3" fill="#818CF8"/>
  <text x="398" y="385" fill="#818CF8" font-family="Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="0.1em">02. BUILD &amp; SAST</text>
  <text x="398" y="415" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="18" font-weight="700">Compile &amp; Quality</text>
  <text x="398" y="445" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">• Multi-Stack (Java/.NET/PHP)</text>
  <text x="398" y="465" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">• SonarQube Quality Gate</text>
  <text x="398" y="485" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">• Snyk Code &amp; Checkmarx</text>
