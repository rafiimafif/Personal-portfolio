    <!-- Badge 1: Jenkins Shared Lib -->
    <rect x="0" y="0" width="150" height="34" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="15" y="21" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12" font-weight="600">⚡ Jenkins Shared Lib</text>

    <!-- Badge 2: SonarQube -->
    <rect x="162" y="0" width="120" height="34" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="177" y="21" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12" font-weight="600">🛡️ SonarQube</text>

    <!-- Badge 3: Snyk -->
