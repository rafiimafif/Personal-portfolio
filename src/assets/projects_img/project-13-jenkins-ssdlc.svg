<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="100" y1="50" x2="1100" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080D1A"/>
      <stop offset="0.5" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#070C18"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10B981"/>
      <stop offset="1" stop-color="#065F46"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" rx="32" fill="url(#bg)"/>

  <!-- Glow effects -->
  <circle cx="150" cy="150" r="220" fill="#38BDF8" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="1050" cy="750" r="260" fill="#818CF8" fill-opacity="0.1" filter="url(#glow)"/>
  <circle cx="950" cy="200" r="180" fill="#10B981" fill-opacity="0.1" filter="url(#glow)"/>

  <!-- Decorative grid lines -->
  <path d="M0 200H1200M0 450H1200M0 700H1200" stroke="#334155" stroke-opacity="0.25" stroke-dasharray="8 8"/>
  <path d="M300 0V900M600 0V900M900 0V900" stroke="#334155" stroke-opacity="0.25" stroke-dasharray="8 8"/>

  <!-- Top Header Badge -->
  <rect x="80" y="80" width="220" height="36" rx="18" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.4"/>
  <text x="190" y="103" text-anchor="middle" fill="#38BDF8" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.2em">JENKINS SHARED LIB</text>

  <text x="80" y="170" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.02em">Enterprise SSDLC DevSecOps</text>
  <text x="80" y="210" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="400">Zero-Trust Pipeline Orchestration &amp; Security Controls</text>

  <!-- Security Pipeline Container -->
  <rect x="80" y="260" width="1040" height="540" rx="24" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Pipeline Header Bar -->
  <rect x="80" y="260" width="1040" height="56" rx="24" fill="#0F172A"/>
  <rect x="80" y="292" width="1040" height="24" fill="#0F172A"/>
  <line x1="80" y1="316" x2="1120" y2="316" stroke="#334155" stroke-width="1"/>
  
  <circle cx="115" cy="288" r="6" fill="#EF4444"/>
  <circle cx="135" cy="288" r="6" fill="#F59E0B"/>
  <circle cx="155" cy="288" r="6" fill="#10B981"/>
  <text x="180" y="293" fill="#64748B" font-family="monospace" font-size="14">vars/templatePipelineOnprem.groovy — 100% Security Gate Compliant</text>

  <!-- Pipeline Stage Diagram (Cards) -->
  
  <!-- Stage 1: Checkout & Secret -->
  <rect x="120" y="350" width="200" height="180" rx="16" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="120" y="350" width="200" height="6" rx="3" fill="#38BDF8"/>
  <text x="140" y="385" fill="#38BDF8" font-family="Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="0.1em">01. SCM &amp; SECRETS</text>
  <text x="140" y="415" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="18" font-weight="700">Checkout &amp; Gitleaks</text>
  <text x="140" y="445" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">• GitHub Enterprise</text>
  <text x="140" y="465" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">• Gitleaks Commit Audit</text>
  <text x="140" y="485" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">• Checkov IaC Security</text>
  <rect x="140" y="502" width="70" height="18" rx="9" fill="#10B981" fill-opacity="0.2"/>
  <text x="175" y="515" text-anchor="middle" fill="#34D399" font-family="Inter, sans-serif" font-size="10" font-weight="700">PASSED</text>

