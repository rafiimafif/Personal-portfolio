  <text x="656" y="415" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="18" font-weight="700">Audits &amp; SBOM</text>
  <text x="656" y="445" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">• Snyk &amp; Trivy FS Scan</text>
  <text x="656" y="465" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">• CycloneDX SBOM</text>
