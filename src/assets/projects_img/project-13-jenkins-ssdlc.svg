  <text x="433" y="515" text-anchor="middle" fill="#34D399" font-family="Inter, sans-serif" font-size="10" font-weight="700">GATE OK</text>

  <!-- Arrow 2-3 -->
  <path d="M588 440H618" stroke="#818CF8" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="618,436 626,440 618,444" fill="#818CF8"/>

