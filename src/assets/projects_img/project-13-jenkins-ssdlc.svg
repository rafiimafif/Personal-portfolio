  <text x="914" y="385" fill="#10B981" font-family="Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="0.1em">04. CD &amp; DAST</text>
  <text x="914" y="415" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="18" font-weight="700">Deploy &amp; Sign</text>
  <text x="914" y="445" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">• OpenShift Deployment</text>
  <text x="914" y="465" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">• Cosign v3 Image Sign</text>
  <text x="914" y="485" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">• OWASP ZAP DAST Scan</text>
  <rect x="914" y="502" width="75" height="18" rx="9" fill="#10B981" fill-opacity="0.2"/>
  <text x="951" y="515" text-anchor="middle" fill="#34D399" font-family="Inter, sans-serif" font-size="10" font-weight="700">RELEASED</text>

  <!-- Bottom Technology Grid Badges -->
  <text x="120" y="575" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13" font-weight="700" letter-spacing="0.15em">INTEGRATED DEVSECOPS TOOLCHAIN &amp; FRAMEWORK</text>

