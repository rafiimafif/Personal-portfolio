    <text x="309" y="21" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12" font-weight="600">🐶 Snyk</text>

    <!-- Badge 4: Trivy -->
    <rect x="396" y="0" width="90" height="34" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="411" y="21" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12" font-weight="600">🔍 Trivy</text>

    <!-- Badge 5: Gitleaks -->
    <rect x="498" y="0" width="105" height="34" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="513" y="21" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12" font-weight="600">🔑 Gitleaks</text>

    <!-- Badge 6: Checkov -->
    <rect x="615" y="0" width="105" height="34" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="630" y="21" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12" font-weight="600">🏗️ Checkov</text>

    <!-- Badge 7: Cosign -->
    <rect x="732" y="0" width="95" height="34" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="747" y="21" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12" font-weight="600">✍️ Cosign</text>

    <!-- Badge 8: OWASP ZAP -->
    <rect x="839" y="0" width="120" height="34" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="854" y="21" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12" font-weight="600">🔥 OWASP ZAP</text>
  </g>

  <g transform="translate(120, 646)">
    <!-- Row 2 Badges -->
    <rect x="0" y="0" width="140" height="34" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="15" y="21" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12" font-weight="600">📦 CycloneDX</text>

    <rect x="152" y="0" width="130" height="34" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="167" y="21" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12" font-weight="600">🎭 Playwright</text>

    <rect x="294" y="0" width="150" height="34" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="309" y="21" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12" font-weight="600">🐸 JFrog Artifactory</text>

    <rect x="456" y="0" width="120" height="34" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="471" y="21" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12" font-weight="600">🔴 OpenShift</text>

    <rect x="588" y="0" width="150" height="34" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="603" y="21" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12" font-weight="600">🚀 GitHub Releases</text>

    <rect x="750" y="0" width="209" height="34" rx="8" fill="#1E293B" stroke="#10B981"/>
    <text x="765" y="21" fill="#34D399" font-family="Inter, sans-serif" font-size="12" font-weight="700">🔒 100% SSDLC Compliant</text>
  </g>
</svg>
